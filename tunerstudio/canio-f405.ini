; TunerStudio definition for the CAN IO expander on the WeAct STM32F405RG core board
; Generated by gen_ini.py - do not edit offsets by hand, edit the generator and regenerate.
;
; Config page: 3228 bytes, little endian, fields in file order with natural C alignment.
; Output channel block: 452 bytes.
;
; Pin map
;   Analog      AN1=PA6, AN2=PA7, AN3=PC0, AN4=PC1, AN5=PC2, AN6=PC3, AN7=PC4, AN8=PC5
;   EGT         EGT1=PA0, EGT2=PA1, EGT3=PA2, EGT4=PA3, EGT5=PA4, EGT6=PA5
;   Frequency   FREQ1=PA15, FREQ2=PB3, FREQ3=PB10, FREQ4=PB11, FREQ5=PA8
;   Digital in  DI1=PC13, DI2=PD2, DI3=PB12, DI4=PB4
;   Outputs     PWM1=PC6, PWM2=PC7, PWM3=PC8, PWM4=PC9, PWM5=PB6, PWM6=PB7, OUT7=PB5, OUT8=PA9, OUT9=PA10, OUT10=PC12
;   Diagnostics 5V rail=PB0, battery=PB1   H-bridge PWM=PB14 DIR=PB15 DIS=PB13   CAN RX=PB8 TX=PB9   USB PA11/PA12
;
; Serial protocol (same as rusEFI, CRC32 envelope msEnvelope_1.0):
;   S hello/signature, V firmware version, O output channels, R read, C chunk write, B burn, k CRC, Z command
;
; CAN frames sent by the board (ID = canTxBaseId + n, 8 bytes, byte order per canBigEndian)
;   +0 status   : u32 fault bits (same order as the status bits below), u8 DI bits, u8 AN switch bits, u16 output state bits
;   +1 analog A : AN1..AN4 value, s16 each, multiplied by the input CAN scale
;   +2 analog B : AN5..AN8 value, s16 each
;   +3 volts A  : AN1..AN4 voltage, u16 mV each
;   +4 volts B  : AN5..AN8 voltage, u16 mV each
;   +5 EGT A    : EGT1..EGT4, s16 0.1 C each
;   +6 EGT B    : EGT5, EGT6, EGT max, EGT spread, s16 0.1 C each
;   +7 freq A   : FREQ1..FREQ4 value, u16 each, multiplied by the input CAN scale
;   +8 freq B   : FREQ5 value u16, battery u16 mV, 5V rail u16 mV, MCU temp s16 0.1 C
;   +9 actuator : position s16 0.01 %, target s16 0.01 %, duty s16 0.01 %, state u8, reserved u8
;   +10 freq 2 A: FREQ1..FREQ4 secondary value (Flex fuel temp, Hella temp, SENT channel 2), s16 each, multiplied by CAN scale 2
;   +11 freq 2 B: FREQ5 secondary value s16, actuator position sensor 2 s16 0.01 %, sensor difference s16 0.01 %, u8 fault bits 2, reserved u8
; calibrationMode values: 1 closedV, 2 openV, 3 closedV2, 4 openV2, 5 P, 6 I, 7 D (0 = idle)
; CAN frames accepted by the board (ID = canRxBaseId + n)
;   +0 outputs  : u16 state bits for OUT1..OUT10 (on/off outputs and PWM outputs in on/off type), 6 bytes reserved
;   +1 duties   : PWM1..PWM6 duty, u8 0.5 % each, 2 bytes reserved
;   +2 actuator : target s16 0.01 %, u8 enable, 5 bytes reserved
;   +3 user A   : CAN user value 1 and 2, f32 each
;   +4 user B   : CAN user value 3 and 4, f32 each

[MegaTune]
	signature = "rusEFI canio.2026.11.12.f405.2"

[TunerStudio]
	queryCommand = "S"
	versionInfo = "V"
	signature = "rusEFI canio.2026.11.12.f405.2"
	useLegacyFTempUnits = false
	ignoreMissingBitOptions = true
	noCommReadDelay = true
	defaultRuntimeRecordPerSec = 50

[Constants]
	messageEnvelopeFormat = msEnvelope_1.0
	endianness = little
	nPages = 1
	pageIdentifier = "\x00\x00"
	pageSize = 3228
	pageReadCommand = "R\x00\x00%2o%2c"
	burnCommand = "B\x00\x00"
	pageValueWrite = "W\x00\x00%2o%v"
	pageChunkWrite = "C\x00\x00%2o%2c%v"
	crc32CheckCommand = "k\x00\x00%2o%2c"
	retrieveConfigError = "e"
	pageActivationDelay = 500
	writeBlocks = on
	interWriteDelay = 0
	blockReadTimeout = 3000
	blockingFactor = 256

page = 1

